springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /api/user/v3/api-docs
    config-url: /api/user/v3/api-docs/swagger-config
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs
    enabled: true    

logging:
  level: 
    root: info
    '[com.ai.chat.service]': debug
    # '[com.alibaba.nacos]': info
    '[org.springframework.cloud]': info
    '[org.hibernate.sql]': debug
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){blue} %clr(%-5level){green} %clr(%logger{36}){cyan}:%clr(%L){magenta} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/user-service.log
  charset:
    console: UTF-8
    file: UTF-8    
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz"    

